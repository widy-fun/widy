name: "publish"

on:
  push:
    branches:
      - master


jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest" # for Intel based macs.
          #   args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          lfs: true


      - name: Pull LFS files
        run: git lfs pull

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgbm-dev \
            libxdo-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libasound2-dev
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.
      - name: install xcap dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev     
      - name: Locate VC++ runtime redist for app-local bundling (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $platform = "x64"
          $dir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\$platform"
          if (-not (Test-Path $dir)) { throw "VC++ redist arch dir not found: $dir" }
          # Glob the VC generation folder; the runtime DLL names stay ABI-stable.
          $crt = Get-ChildItem $dir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $dir"
          }
          $dirs = $crt.FullName
          if ($platform -eq "x64") {
            $omp = Get-ChildItem $dir -Directory -Filter "Microsoft.VC*.OpenMP" |
              Sort-Object Name | Select-Object -Last 1
            if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
              throw "VC++ OpenMP redist dir not found or incomplete under: $dir"
            }
            $dirs = "$($crt.FullName);$($omp.FullName)"
          }
          Write-Host "WIDY_VC_REDIST_DIRS=$dirs"
          Add-Content -Path $env:GITHUB_ENV -Value "WIDY_VC_REDIST_DIRS=$dirs"
      - name: run tests
        working-directory: ./src-tauri
        run: cargo test
      - name: import windows certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)  
      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: build widget
        run: npm run widget:build
      - name: build auc-fighter-adapter
        run: npm run auc-fighter-adapter:build
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_USER_ID_MOCK: ${{ secrets.TWITCH_USER_ID_MOCK }}
          TWITCH_CLIENT_ID_MOCK: ${{ secrets.TWITCH_CLIENT_ID_MOCK }}
          TWITCH_CLIENT_SECRET_MOCK: ${{ secrets.TWITCH_CLIENT_SECRET_MOCK }}
          VITE_WIDY_BASE_DOMAINE: ${{ secrets.VITE_WIDY_BASE_DOMAINE }}
          WIDY_SOL_PROGRAM_ID: ${{ secrets.WIDY_SOL_PROGRAM_ID }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_BOT_CLIENT_ID: ${{ secrets.KICK_BOT_CLIENT_ID }}
          KICK_TOKEN_ENDPOINT: ${{ secrets.KICK_TOKEN_ENDPOINT }}
          KICK_BOT_TOKEN_ENDPOINT: ${{ secrets.KICK_BOT_TOKEN_ENDPOINT }}
          KICK_REDIRECT_URI: ${{ secrets.KICK_REDIRECT_URI }}
          KICK_BOT_REDIRECT_URI: ${{ secrets.KICK_BOT_REDIRECT_URI }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "v__VERSION__"
          releaseBody: "Refactor errors and initialization."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_USER_ID_MOCK: ${{ secrets.TWITCH_USER_ID_MOCK }}
          TWITCH_CLIENT_ID_MOCK: ${{ secrets.TWITCH_CLIENT_ID_MOCK }}
          TWITCH_CLIENT_SECRET_MOCK: ${{ secrets.TWITCH_CLIENT_SECRET_MOCK }}
          VITE_WIDY_BASE_DOMAINE: ${{ secrets.VITE_WIDY_BASE_DOMAINE }}
          WIDY_SOL_PROGRAM_ID: ${{ secrets.WIDY_SOL_PROGRAM_ID }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_BOT_CLIENT_ID: ${{ secrets.KICK_BOT_CLIENT_ID }}
          KICK_TOKEN_ENDPOINT: ${{ secrets.KICK_TOKEN_ENDPOINT }}
          KICK_BOT_TOKEN_ENDPOINT: ${{ secrets.KICK_BOT_TOKEN_ENDPOINT }}
          KICK_REDIRECT_URI: ${{ secrets.KICK_REDIRECT_URI }}
          KICK_BOT_REDIRECT_URI: ${{ secrets.KICK_BOT_REDIRECT_URI }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        with:
          tagName: latest # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "latest"
          releaseBody: "Refactor errors and initialization."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          