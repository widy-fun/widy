[workspace]
resolver = "3"
members = [ "crates/*", "src-tauri" ]

[workspace.dependencies]
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }
model = { path = "crates/model" }
database = { path = "crates/database" }
tauri = { version = "2", features = ["protocol-asset"] }
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
futures = "0.3.31"
thiserror = "2.0.12"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12.14", features = ["multipart", "native-tls-alpn"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = [ "serde"] }
async-trait = "0.1.88"
regex = "1.11.1"
lingua = "1.7.1"
tauri-plugin-log = "2"
log = "0.4.27"
url = { version = "2.5.4", features = ["serde"] }
tauri-plugin-devtools = "2.0.0"
urlencoding = "2.1.3"
axum = { version = "0.8.4", features = ["ws"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "cors"] }
tauri-plugin-opener = "2"
dotenvy = "0.15.7"
anchor-lang = "0.32.1"
anchor-client = { version = "0.32.1", features = ["async"] }
solana-sdk = "3.0.0"
openssl-sys = { version = "0.9.111", features = ["vendored"] }
tauri-plugin-deep-link = "2"
serde_qs = "0.15"
eventsource-client = "0.16.2"
tonlib-core = "0.26.6"
hex = "0.4.3"
rust_socketio = { version = "0.6.0", features = ["async"] }
msedge-tts = "0.4.1"
mime_guess = "2.0.5"
http = "1.4.0"
zip = "8.5.0"
image = { version = "0.25.6", features = ["default-formats"] }
xcap = { version = "0.9.4", features = ["image"] }
base64 = "0.22.1"
rand = "0.10.1"
sha2 = "0.11.0"
tokio-util = "0.7.18"
ndarray = "0.17.2"
espeak-ng = "0.1.3"
hound = "3.5.1"
tauri-plugin-upload = "2"
cpal = "0.18.2"
foundry-local-sdk = "1.2.3"
teloxide = "0.17.0"
scraper = "0.29.0"
sea-orm = { version = "2.0.4", features = [
    "macros",
    "with-json",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
sea-orm-migration = { version = "2.0.4", features = [
    "with-json",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "=2.0.0-rc.13"
tempfile = "3.19.1"
mockall = "0.13.1"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tokio-stream = { version = "0.1.19", features = ["sync"] }
dirs = "7.0.0"