[package]
name = "widy"
version = "0.4.6"
description = "Widy is a unified alert and widget service for streamers that works across multiple platforms."
authors = ["ik1s3v"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "widy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
mock = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
entity = { workspace = true }
model = { workspace = true }
migration = { workspace = true }
database = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
lingua = { workspace = true }
tauri-plugin-log = { workspace = true }
log = { workspace = true }
url = { workspace = true }
tauri-plugin-devtools = { workspace = true }
urlencoding = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tauri-plugin-opener = { workspace = true }
dotenvy = { workspace = true }
anchor-lang = { workspace = true }
anchor-client = { workspace = true }
solana-sdk = { workspace = true }
openssl-sys = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
serde_qs = { workspace = true }
eventsource-client = { workspace = true }
tonlib-core = { workspace = true }
hex = { workspace = true }
rust_socketio = { workspace = true }
msedge-tts = { workspace = true }
mime_guess = { workspace = true }
http = { workspace = true }
zip = { workspace = true }
image = { workspace = true }
xcap = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
tokio-util = { workspace = true }
ort = { workspace = true }
ndarray = { workspace = true }
espeak-ng = { workspace = true }
hound = { workspace = true }
tauri-plugin-upload = { workspace = true }
cpal = { workspace = true }
foundry-local-sdk = { workspace = true }
teloxide = { workspace = true }
scraper = { workspace = true }
obws = { workspace = true }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }



[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }

