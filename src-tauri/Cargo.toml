[package]
name = "widy"
version = "0.3.4"
description = "Widy is a unified alert and widget service for streamers that works across multiple platforms."
authors = ["ik1s3v"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "widy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
futures = "0.3.31"
thiserror = "2.0.12"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12.14", features = ["native-tls-alpn"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = [ "serde"] }
async-trait = "0.1.88"
regex = "1.11.1"
lingua = "1.7.1"
sea-orm = { version = "2.0.0-rc.20", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
tauri-plugin-log = "2"
log = "0.4.27"
url = { version = "2.5.4", features = ["serde"] }
tauri-plugin-devtools = "2.0.0"
urlencoding = "2.1.3"
axum = { version = "0.8.4", features = ["ws"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "cors"] }
tauri-plugin-opener = "2"
dotenvy = "0.15.7"
anchor-lang = "0.32.1"
anchor-client = { version = "0.32.1", features = ["async"] }
solana-sdk = "3.0.0"
openssl-sys = { version = "0.9.111", features = ["vendored"] }
tauri-plugin-deep-link = "2"
serde_qs = "0.15"
eventsource-client = "0.16.2"
tonlib-core = "0.26.6"
hex = "0.4.3"
rust_socketio = { version = "0.6.0", features = ["async"] }
msedge-tts = "0.3.0"
mime_guess = "2.0.5"
http = "1.4.0"
zip = "8.5.0"
image = { version = "0.25.6", features = ["default-formats"] }
xcap = { version = "0.9.4", features = ["image"] }
rten-tensor = { git = "https://github.com/robertknight/rten.git", rev = "bae32b361aaa16fa34f8a36cac58f5376d937ab3" }
rten-imageio = { git = "https://github.com/robertknight/rten.git", rev = "bae32b361aaa16fa34f8a36cac58f5376d937ab3" }
rten = { git = "https://github.com/robertknight/rten.git", rev = "bae32b361aaa16fa34f8a36cac58f5376d937ab3" }
base64 = "0.22.1"
rand = "0.10.1"
sha2 = "0.11.0"
tokio-util = "0.7.18"
ort = "2.0.0-rc.13"
ndarray = "0.17.2"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }

[dev-dependencies]
tempfile = "3.19.1"
mockall = "0.13.1"

